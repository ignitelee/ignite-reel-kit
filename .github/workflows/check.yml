name: Check student kit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        # macOS runners are often unavailable on free GitHub accounts (the job sits queued, then is cancelled
        # and emails a failure); the kit is plain Node, so Linux + Windows cover the same code.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run demo
      - run: node scripts/preflight.mjs video-projects/demo
      - run: npx hyperframes lint video-projects/demo
